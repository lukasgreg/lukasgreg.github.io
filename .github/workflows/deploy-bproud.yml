# Nasazení webu B Proud (složka bproud6/) na hosting bproud.cz přes SFTP (port 222, šifrované).
# Přihlašovací údaje jsou v GitHub Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
#
# Spouští se ručně (Actions → Deploy bproud.cz → Run workflow):
#   list    – otestuje přihlášení a vypíše složky na serveru (nic nemění)
#   dry-run – ukáže, co by se nahrálo/smazalo (nic nemění)
#   deploy  – nahraje změněné soubory; se "delete" smaže na serveru soubory, které v bproud6/ nejsou
#   archive – přesune VŠE ze server_dir do /backup/web-<datum-čas>/ na serveru (vratné vyčištění)
name: Deploy bproud.cz

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list / dry-run / deploy / archive"
        type: choice
        options: [list, dry-run, deploy, archive]
        default: list
      server_dir:
        description: "Cílová složka na serveru (web root)"
        type: string
        default: "/bproud.cz/web"
      delete:
        description: "Smazat na serveru soubory, které nejsou v bproud6/"
        type: boolean
        default: false

concurrency: deploy-bproud

jobs:
  sftp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: inputs.mode != 'list'

      - name: Instalace lftp
        run: sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null

      - name: ${{ inputs.mode }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          DIR: ${{ inputs.server_dir }}
          DELETE: ${{ inputs.delete }}
        run: |
          HOST="${FTP_SERVER#*://}"; HOST="${HOST%%/*}"; HOST="${HOST%%:*}"
          export LFTP_PASSWORD="$FTP_PASSWORD"
          SETTINGS="set sftp:auto-confirm yes; set net:max-retries 3; set net:reconnect-interval-base 5; set net:timeout 20; set cmd:fail-exit yes"
          echo "IP runneru: $(curl -s --max-time 10 https://api.ipify.org)"
          # Hosting občas odmítne spojení – celý příkaz zkusíme až 5× (mirror je idempotentní)
          run() {
            for i in 1 2 3 4 5; do
              timeout 180 lftp --env-password -u "$FTP_USERNAME" -p 222 "sftp://$HOST" -e "$SETTINGS; $1; bye" && return 0
              echo "⚠️ Pokus $i selhal, zkusím znovu za $((i * 10)) s"; sleep $((i * 10))
            done
            return 1
          }

          if [ "$MODE" = list ]; then
            echo "--- / ---";               run "cls -la /"
            echo "--- /bproud.cz/ ---";      run "cls -la /bproud.cz/" || true
            echo "--- $DIR ---";             run "cls -la $DIR" || true
            exit 0
          fi

          if [ "$MODE" = archive ]; then
            DEST="/backup/web-$(date -u +%Y%m%d-%H%M%S)"
            echo "Přesouvám obsah $DIR do $DEST"
            run "mkdir -p $DEST"
            run "cd $DIR; mmv -O $DEST *" || echo "(žádné viditelné soubory)"
            run "cd $DIR; mmv -O $DEST .htaccess" || echo "(žádný .htaccess)"
            echo "--- $DEST ---"; run "cls -la $DEST"
            echo "--- $DIR (má být prázdný) ---"; run "cls -la $DIR"
            exit 0
          fi

          FLAGS="--reverse --verbose --parallel=4 --exclude-glob .git* --exclude-glob _*"
          [ "$DELETE" = true ] && FLAGS="$FLAGS --delete"
          [ "$MODE" = dry-run ] && FLAGS="$FLAGS --dry-run"
          run "mirror $FLAGS ./bproud6/ $DIR"
